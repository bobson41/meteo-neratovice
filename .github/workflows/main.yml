name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (without faulty cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Fix Manifest Icon References
        run: |
          sed -i '/android:icon=/d' app/src/main/AndroidManifest.xml
          sed -i '/android:roundIcon=/d' app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meteo-Neratovice-APK
          path: app/build/outputs/apk/debug/app-debug.apk
